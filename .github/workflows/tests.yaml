name: Run package tests

on:
  push:
    paths:
      - "pysquril/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/tests.yaml"

env:
  POETRY_VERSION: 2.4.1


jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14"
            is_latest: true

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
      - name: Install Poetry
        run: pipx install poetry==${{env.POETRY_VERSION}}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
          cache-dependency-path: "poetry.lock"
      - name: Install package dependencies
        run: |
          poetry env use ${{ matrix.python-version }}
          poetry install -E async
      - name: Test with pytest
        run: poetry run pytest --cov=pysquril --cov-report=term --cov-report=html

      # Generate coverage summary in workflow run summary (only for latest Python)
      - name: Generate coverage summary
        if: matrix.is_latest
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          poetry run coverage report >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Upload HTML coverage report as downloadable artifact
      - name: Upload coverage HTML
        if: matrix.is_latest
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-report
          path: htmlcov/
